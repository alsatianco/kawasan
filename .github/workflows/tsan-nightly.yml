# Phase EX-4 (§6.4): ThreadSanitizer checks on main commits.
name: tsan
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential ninja-build clang-15 libclang-rt-15-dev \
            libboost-all-dev librocksdb-dev libsnappy-dev liblz4-dev libzstd-dev \
            libfmt-dev libspdlog-dev libgtest-dev nlohmann-json3-dev \
            libssl-dev

      - name: Configure (TSan)
        env:
          CC: clang-15
          CXX: clang++-15
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DKAWASAN_ENABLE_TSAN=ON \
            -DKAWASAN_BUILD_TESTS=ON \
            -GNinja

      - name: Build
        run: cmake --build build -j2 2>&1 | tee /tmp/tsan-build.log

      - name: Run tests (TSan)
        env:
          TSAN_OPTIONS: "halt_on_error=1:report_thread_leaks=0"
        run: |
          # LLVM 15 supports up to 28 bits of x86 ASLR entropy. Ubuntu 24.04
          # defaults to 32: https://github.com/google/sanitizers/issues/1716
          sudo sysctl -w vm.mmap_rnd_bits=28
          ctest --test-dir build --output-on-failure --timeout 600

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tsan-logs
          path: |
            build/Testing/Temporary/
            /tmp/tsan-build.log
