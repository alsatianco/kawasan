# Phase EX-4 (§6.4): Commit-triggered benchmark regression check. Compares the
# previous and current commits on the same runner. Alerts
# (failing the job) when regression > 10%.
name: bench-regression
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential ninja-build clang \
            libboost-all-dev librocksdb-dev libsnappy-dev liblz4-dev libzstd-dev \
            libfmt-dev libspdlog-dev libgtest-dev nlohmann-json3-dev \
            libssl-dev python3-pip
          pip install kafka-python confluent-kafka

      - name: Build (Release)
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="${BEFORE_SHA:-HEAD^}"
          if [[ "$base" =~ ^0+$ ]]; then base=HEAD^; fi
          git worktree add --detach "$RUNNER_TEMP/bench-base" "$base"
          for source in "$RUNNER_TEMP/bench-base" "$GITHUB_WORKSPACE"; do
            cmake -S "$source" -B "$source/build" -DCMAKE_BUILD_TYPE=Release -GNinja \
              -DKAWASAN_BUILD_TESTS=OFF -DKAWASAN_BUILD_EXAMPLES=OFF
            cmake --build "$source/build" -j2 --target kawasan-broker
          done

      - name: Run produce benchmark
        run: |
          bash bench/run_ci.sh "$RUNNER_TEMP/bench-base/build/tools/kawasan-broker" /tmp/bench-base.json
          bash bench/run_ci.sh "$GITHUB_WORKSPACE/build/tools/kawasan-broker" /tmp/bench-head.json

      - name: Compare to baseline
        run: |
          python3 bench/check_regression.py \
            --base /tmp/bench-base.json \
            --head /tmp/bench-head.json \
            --threshold-pct 10

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-result
          path: |
            /tmp/bench-base.json
            /tmp/bench-head.json
            /tmp/bench-*.json.broker.log
