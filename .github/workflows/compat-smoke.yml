name: compat-smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  oracle:
    name: Kafka 4.2 oracle (baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python kafka client
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tests/ecosystem/requirements.txt
          sudo apt-get update && sudo apt-get install -y kcat
      - name: Run harness against Kafka oracle
        working-directory: tests/ecosystem
        run: ./scripts/run_all.sh kafka

  candidate:
    name: Kawasan candidate
    runs-on: ubuntu-latest
    needs: oracle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python kafka client
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tests/ecosystem/requirements.txt
          sudo apt-get update && sudo apt-get install -y kcat
      - name: Run harness against Kawasan candidate
        working-directory: tests/ecosystem
        run: ./scripts/run_all.sh kawasan
