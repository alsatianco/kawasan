# Phase EX-4 (§6.4): nightly matrix compat run against `latest` images
# of every Confluent ecosystem service. Catches regressions in the
# ecosystem tools that pinned-version CI wouldn't see.
name: compat-matrix-nightly
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCHEMA_REGISTRY_IMAGE: confluentinc/cp-schema-registry:latest
      KAFKA_UI_IMAGE: provectuslabs/kafka-ui:latest
      KAFKA_CONNECT_IMAGE: confluentinc/cp-kafka-connect:latest
      KSQLDB_IMAGE: confluentinc/ksqldb-server:latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - schema-registry
          - kafka-ui
          - kafka-connect
          - ksqldb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install clients
        run: |
          sudo apt-get update && sudo apt-get install -y kcat
          pip install -r tests/ecosystem/requirements.txt

      - name: Start container broker
        run: |
          docker compose -f tests/ecosystem/docker-compose.kawasan.yml up -d --build --wait

      - name: Run ${{ matrix.component }} smoke
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          case "$COMPONENT" in
            schema-registry) bash tests/ecosystem/scripts/13_schema_registry.sh kawasan ;;
            kafka-ui)        bash tests/ecosystem/scripts/14_kafka_ui.sh kawasan ;;
            kafka-connect)   bash tests/ecosystem/scripts/15_kafka_connect.sh kawasan ;;
            ksqldb)          bash tests/ecosystem/scripts/16_ksqldb.sh kawasan ;;
          esac

      - name: Capture broker log and clean up
        if: always()
        run: |
          docker logs kawasan-harness-candidate > /tmp/k-mx.log 2>&1 || true
          docker compose -f tests/ecosystem/docker-compose.kawasan.yml down -v

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compat-${{ matrix.component }}-logs
          path: /tmp/k-mx.log
