# Phase EX-4 (§6.4): libFuzzer checks on main commits. Each fuzz target runs 5 minutes
# against the previously-recorded corpus (cache the corpus dir between
# runs so escaping coverage accumulates).
name: fuzz
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - request_header
          - record_batch
          - produce_request
          - fetch_request
          - metadata_request
          - compression
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential ninja-build clang-18 libclang-rt-18-dev \
            libboost-all-dev librocksdb-dev libsnappy-dev liblz4-dev libzstd-dev \
            libfmt-dev libspdlog-dev libgtest-dev nlohmann-json3-dev \
            libssl-dev

      - name: Configure (libFuzzer + ASan)
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DKAWASAN_BUILD_FUZZ=ON \
            -DKAWASAN_ENABLE_ASAN=ON \
            -GNinja

      - name: Build fuzzer
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          cmake --build build -j2 --target "fuzz_${TARGET}" 2>&1 | tee /tmp/fuzz-build.log

      - name: Cache corpus
        uses: actions/cache@v4
        env:
          TARGET: ${{ matrix.target }}
        with:
          path: corpus-${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Run 5-minute fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "corpus-${TARGET}"
          mkdir -p /tmp/fuzz-artifacts
          "./build/tests/fuzz/fuzz_${TARGET}" "corpus-${TARGET}" \
            -max_total_time=300 \
            -timeout=30 \
            -artifact_prefix=/tmp/fuzz-artifacts/ \
            -print_final_stats=1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            /tmp/fuzz-artifacts/
            /tmp/fuzz-build.log
