{
  "# ==========================================": "",
  "# Kawasan Broker - Development Configuration": "",
  "# ==========================================": "",
  "# This configuration is optimized for local development": "",
  "# - Lower resource limits for laptop/desktop use": "",
  "# - Shorter retention for quick iteration": "",
  "# - Verbose logging for debugging": "",
  "# - Fast restarts and no durability guarantees": "",
  
  "# Broker Identity": "",
  "broker.id": 0,
  "host": "localhost",
  "advertised.host": "localhost",
  "port": 9092,
  
  "# Storage Paths (using /tmp for easy cleanup)": "",
  "log.dirs": "/tmp/kawasan-dev-logs",
  
  "# Network Settings (lower threads for dev)": "",
  "num.network.threads": 2,
  "num.io.threads": 2,
  "socket.send.buffer.bytes": 65536,
  "socket.receive.buffer.bytes": 65536,
  "socket.request.max.bytes": 10485760,
  
  "# Log Settings (aggressive cleanup for dev)": "",
  "log.segment.bytes": 104857600,
  "log.retention.hours": 24,
  "log.retention.bytes": 1073741824,
  "log.retention.check.interval.ms": 60000,
  "log.cleaner.interval.ms": 5000,
  "log.cleanup.policy": "delete",
  
  "# Flush Settings (fast but no durability)": "",
  "log.flush.interval.messages": 1000,
  "log.flush.interval.ms": 500,
  
  "# Replication Settings (single broker)": "",
  "default.replication.factor": 1,
  "min.insync.replicas": 1,
  "offsets.topic.replication.factor": 1,
  "transaction.state.log.replication.factor": 1,
  "transaction.state.log.min.isr": 1,
  
  "# Recovery Settings": "",
  "num.recovery.threads.per.data.dir": 1,
  
  "# Compression (disabled for faster debugging)": "",
  "compression.type": "none",
  
  "# Group Coordinator Settings": "",
  "group.initial.rebalance.delay.ms": 0,
  "group.max.session.timeout.ms": 30000,
  "group.min.session.timeout.ms": 6000,
  
  "# Producer Settings": "",
  "max.request.size": 1048576,
  
  "# Consumer Settings": "",
  "fetch.min.bytes": 1,
  "fetch.max.wait.ms": 100,
  
  "# Partition Settings": "",
  "num.partitions": 1,
  
  "# Metrics and Monitoring (verbose for dev)": "",
  "metrics.recording.level": "DEBUG",
  "monitoring.host": "0.0.0.0",
  "monitoring.port": 9094,
  "monitoring.enabled": true,
  "# Consumer lag metrics DISABLED by default due to -12% producer, -16% consumer perf impact": "",
  "consumer.lag.metrics.enabled": false,
  "consumer.lag.check.interval.ms": 30000,
  
  "# Development-specific settings": "",
  "# Fast startup, minimal resource usage": "",
  "auto.create.topics.enable": true,
  "delete.topic.enable": true,
  
  "# Logging": "",
  "log.level": "debug",
  "log.format": "text",
  
  "# Security (disabled for dev)": "",
  "security.protocol": "PLAINTEXT",
  "# TLS disabled for local development": "",
  "# SASL disabled for local development": ""
}
