{
  "# ==========================================": "",
  "# Kawasan Broker - Production Configuration": "",
  "# ==========================================": "",
  "# This configuration is optimized for production use:": "",
  "# - High durability and data safety": "",
  "# - Optimized for performance and throughput": "",
  "# - Comprehensive monitoring enabled": "",
  "# - All secrets loaded from environment variables": "",
  "# - Follows Kafka compatibility where applicable": "",
  
  "# ==========================================": "",
  "# BROKER IDENTITY": "",
  "# ==========================================": "",
  "# REQUIRED: Set via KAWASAN_BROKER_ID environment variable": "",
  "# Each broker in the cluster must have a unique ID": "",
  "broker.id": "${KAWASAN_BROKER_ID}",
  
  "# Network binding": "",
  "# 0.0.0.0 allows connections from any interface": "",
  "host": "${KAWASAN_HOST:0.0.0.0}",
  
  "# Advertised host is what clients connect to": "",
  "# CRITICAL: Set this to the externally accessible hostname/IP": "",
  "advertised.host": "${KAWASAN_ADVERTISED_HOST}",
  
  "# Port configuration": "",
  "port": "${KAWASAN_PORT:9092}",
  
  "# ==========================================": "",
  "# STORAGE CONFIGURATION": "",
  "# ==========================================": "",
  "# Data directory - must be on fast SSD storage": "",
  "# Supports multiple directories for disk I/O parallelism": "",
  "# Example: /mnt/data1,/mnt/data2,/mnt/data3": "",
  "log.dirs": "${KAWASAN_LOG_DIRS:/var/lib/kawasan/data}",
  
  "# ==========================================": "",
  "# NETWORK SETTINGS": "",
  "# ==========================================": "",
  "# Number of threads for network I/O": "",
  "# Recommendation: 8 for most workloads, scale up for very high throughput": "",
  "num.network.threads": "${KAWASAN_NETWORK_THREADS:8}",
  
  "# Number of threads for disk I/O": "",
  "# Recommendation: Equal to number of log.dirs": "",
  "num.io.threads": "${KAWASAN_IO_THREADS:8}",
  
  "# Socket buffer sizes (bytes)": "",
  "# Increase for high-throughput scenarios": "",
  "socket.send.buffer.bytes": 262144,
  "socket.receive.buffer.bytes": 262144,
  
  "# Maximum size of a request": "",
  "# Should be larger than any single message": "",
  "socket.request.max.bytes": 104857600,
  
  "# ==========================================": "",
  "# LOG SEGMENT SETTINGS": "",
  "# ==========================================": "",
  "# Size of a single log segment file (1GB)": "",
  "# Smaller = more files, more overhead": "",
  "# Larger = less files, slower compaction": "",
  "log.segment.bytes": 1073741824,
  
  "# Time-based retention (168 hours = 7 days)": "",
  "# After this period, segments are eligible for deletion": "",
  "log.retention.hours": "${KAWASAN_RETENTION_HOURS:168}",
  
  "# Size-based retention (-1 = unlimited)": "",
  "# Set to a specific value to cap disk usage": "",
  "# Example: 1099511627776 = 1TB": "",
  "log.retention.bytes": "${KAWASAN_RETENTION_BYTES:-1}",
  
  "# How often to check for log deletion": "",
  "log.retention.check.interval.ms": 300000,
  
  "# Log cleanup policy": "",
  "# delete = time/size based deletion": "",
  "# compact = keep latest value for each key": "",
  "log.cleanup.policy": "${KAWASAN_CLEANUP_POLICY:delete}",
  
  "# ==========================================": "",
  "# DURABILITY & FLUSH SETTINGS": "",
  "# ==========================================": "",
  "# Flush to disk after N messages": "",
  "# Higher = better performance, lower durability": "",
  "log.flush.interval.messages": "${KAWASAN_FLUSH_MESSAGES:10000}",
  
  "# Flush to disk after N milliseconds": "",
  "# Higher = better performance, lower durability": "",
  "log.flush.interval.ms": "${KAWASAN_FLUSH_MS:1000}",
  
  "# ==========================================": "",
  "# REPLICATION SETTINGS": "",
  "# ==========================================": "",
  "# Default replication factor for auto-created topics.": "",
  "# Single-node production: 1. Multi-broker replication is EXPERIMENTAL and the": "",
  "# broker currently forces RF to 1 — do not set >1 in production.": "",
  "default.replication.factor": "${KAWASAN_REPLICATION_FACTOR:1}",

  "# Minimum in-sync replicas for acks=all.": "",
  "# Must be 1 on single-node (only the leader is in the ISR).": "",
  "min.insync.replicas": "${KAWASAN_MIN_ISR:1}",

  "# Replication factor for offset topic": "",
  "offsets.topic.replication.factor": "${KAWASAN_OFFSETS_RF:1}",

  "# Replication factor for transaction log": "",
  "transaction.state.log.replication.factor": "${KAWASAN_TXN_RF:1}",
  "transaction.state.log.min.isr": "${KAWASAN_TXN_MIN_ISR:1}",
  
  "# Maximum lag before a replica is removed from ISR": "",
  "replica.lag.time.max.ms": "${KAWASAN_REPLICA_LAG_MS:30000}",
  
  "# Number of fetcher threads per broker": "",
  "num.replica.fetchers": "${KAWASAN_REPLICA_FETCHERS:4}",
  
  "# ==========================================": "",
  "# RECOVERY SETTINGS": "",
  "# ==========================================": "",
  "# Threads for log recovery and flushing": "",
  "num.recovery.threads.per.data.dir": "${KAWASAN_RECOVERY_THREADS:2}",
  
  "# ==========================================": "",
  "# COMPRESSION": "",
  "# ==========================================": "",
  "# Compression type for all topics": "",
  "# Options: none, gzip, snappy, lz4, zstd": "",
  "# Recommendation: lz4 (good balance) or zstd (best compression)": "",
  "compression.type": "${KAWASAN_COMPRESSION:lz4}",
  
  "# ==========================================": "",
  "# CONSUMER GROUP SETTINGS": "",
  "# ==========================================": "",
  "# Delay before triggering rebalance": "",
  "# Give consumers time to join before starting": "",
  "group.initial.rebalance.delay.ms": "${KAWASAN_REBALANCE_DELAY:3000}",
  
  "# Maximum session timeout": "",
  "group.max.session.timeout.ms": 300000,
  
  "# Minimum session timeout": "",
  "group.min.session.timeout.ms": 6000,
  
  "# ==========================================": "",
  "# PRODUCER SETTINGS": "",
  "# ==========================================": "",
  "# Maximum size of a single request": "",
  "max.request.size": 1048576,
  
  "# ==========================================": "",
  "# CONSUMER SETTINGS": "",
  "# ==========================================": "",
  "# Minimum bytes to fetch": "",
  "fetch.min.bytes": 1,
  
  "# Maximum wait time for fetch": "",
  "fetch.max.wait.ms": 500,
  
  "# ==========================================": "",
  "# PARTITION SETTINGS": "",
  "# ==========================================": "",
  "# Default number of partitions for new topics": "",
  "# Recommendation: 3-12 depending on throughput needs": "",
  "num.partitions": "${KAWASAN_NUM_PARTITIONS:6}",
  
  "# ==========================================": "",
  "# METRICS AND MONITORING": "",
  "# ==========================================": "",
  "# Metrics recording level": "",
  "# Options: DEBUG, INFO, WARN, ERROR": "",
  "metrics.recording.level": "${KAWASAN_METRICS_LEVEL:INFO}",
  
  "# HTTP monitoring endpoint port": "",
  "monitoring.port": "${KAWASAN_MONITORING_PORT:8080}",
  
  "# Enable Prometheus metrics and health checks": "",
  "monitoring.enabled": "${KAWASAN_MONITORING_ENABLED:true}",
  
  "# ==========================================": "",
  "# TOPIC MANAGEMENT": "",
  "# ==========================================": "",
  "# Auto-create topics on first produce/consume": "",
  "# Recommendation: false for production (explicit topic creation)": "",
  "auto.create.topics.enable": "${KAWASAN_AUTO_CREATE_TOPICS:false}",
  
  "# Enable topic deletion": "",
  "delete.topic.enable": "${KAWASAN_DELETE_TOPICS:true}",
  
  "# ==========================================": "",
  "# LOGGING": "",
  "# ==========================================": "",
  "# Log level: trace, debug, info, warn, error": "",
  "# Recommendation: info for production": "",
  "log.level": "${KAWASAN_LOG_LEVEL:info}",
  
  "# Log format: text or json": "",
  "# Recommendation: json for production (better for log aggregation)": "",
  "log.format": "${KAWASAN_LOG_FORMAT:json}",
  
  "# ==========================================": "",
  "# SECURITY SETTINGS": "",
  "# ==========================================": "",
  "# Security protocol": "",
  "# Options: PLAINTEXT, SASL_PLAINTEXT. NOTE: client/broker TLS (SSL,": "",
  "# SASL_SSL) is NOT implemented in this build — the broker refuses to start": "",
  "# under an SSL protocol. Terminate TLS at a proxy if you need encryption.": "",
  "security.protocol": "${KAWASAN_SECURITY_PROTOCOL:PLAINTEXT}",

  "# ==========================================": "",
  "# TLS/SSL CONFIGURATION": "",
  "# ==========================================": "",
  "# Enable TLS encryption (NOT implemented — keep false; see security.protocol)": "",
  "ssl.enabled": "${KAWASAN_SSL_ENABLED:false}",
  
  "# Keystore location (server certificate)": "",
  "# CRITICAL: Use environment variable or secrets manager": "",
  "ssl.keystore.location": "${KAWASAN_SSL_KEYSTORE:/etc/kawasan/ssl/keystore.jks}",
  
  "# Keystore password": "",
  "# Set via environment variable when SSL is enabled (empty default so the": "",
  "# config still loads under the default PLAINTEXT protocol).": "",
  "ssl.keystore.password": "${KAWASAN_SSL_KEYSTORE_PASSWORD:}",

  "# Key password (set when SSL enabled)": "",
  "ssl.key.password": "${KAWASAN_SSL_KEY_PASSWORD:}",

  "# Truststore location (CA certificates)": "",
  "ssl.truststore.location": "${KAWASAN_SSL_TRUSTSTORE:/etc/kawasan/ssl/truststore.jks}",

  "# Truststore password (set when SSL enabled)": "",
  "ssl.truststore.password": "${KAWASAN_SSL_TRUSTSTORE_PASSWORD:}",
  
  "# TLS protocol version": "",
  "ssl.protocol": "${KAWASAN_SSL_PROTOCOL:TLSv1.3}",
  
  "# Cipher suites (leave empty for defaults)": "",
  "ssl.cipher.suites": "${KAWASAN_SSL_CIPHER_SUITES:}",
  
  "# Client authentication": "",
  "# Options: none, requested, required": "",
  "ssl.client.auth": "${KAWASAN_SSL_CLIENT_AUTH:none}",
  
  "# ==========================================": "",
  "# SASL AUTHENTICATION": "",
  "# ==========================================": "",
  "# Enable SASL authentication": "",
  "sasl.enabled": "${KAWASAN_SASL_ENABLED:false}",
  
  "# SASL mechanism": "",
  "# Options: PLAIN, SCRAM-SHA-256, SCRAM-SHA-512, GSSAPI": "",
  "sasl.mechanism": "${KAWASAN_SASL_MECHANISM:SCRAM-SHA-256}",
  
  "# SASL JAAS configuration": "",
  "# CRITICAL: Must be set via environment variable": "",
  "sasl.jaas.config": "${KAWASAN_SASL_JAAS_CONFIG:}",
  
  "# ==========================================": "",
  "# PERFORMANCE TUNING": "",
  "# ==========================================": "",
  "# OS page cache flush behavior": "",
  "# Leave at defaults for most cases": "",
  "log.flush.scheduler.interval.ms": 60000,
  
  "# Background thread check interval": "",
  "background.threads": "${KAWASAN_BACKGROUND_THREADS:10}",
  
  "# Message timestamp type": "",
  "# Options: CreateTime, LogAppendTime": "",
  "log.message.timestamp.type": "${KAWASAN_TIMESTAMP_TYPE:CreateTime}",
  
  "# ==========================================": "",
  "# QUOTA AND RATE LIMITING": "",
  "# ==========================================": "",
  "# Producer quota (bytes/sec per client)": "",
  "# -1 = unlimited": "",
  "quota.producer.default": "${KAWASAN_QUOTA_PRODUCER:-1}",
  
  "# Consumer quota (bytes/sec per client)": "",
  "# -1 = unlimited": "",
  "quota.consumer.default": "${KAWASAN_QUOTA_CONSUMER:-1}",
  
  "# ==========================================": "",
  "# ZOOKEEPER SETTINGS": "",
  "# ==========================================": "",
  "# (If using ZooKeeper for coordination)": "",
  "# Note: Kawasan uses Raft by default, ZooKeeper is optional": "",
  "zookeeper.connect": "${KAWASAN_ZOOKEEPER_CONNECT:}",
  "zookeeper.connection.timeout.ms": "${KAWASAN_ZOOKEEPER_TIMEOUT:18000}",
  
  "# ==========================================": "",
  "# SECRETS MANAGEMENT": "",
  "# ==========================================": "",
  "# CRITICAL SECURITY NOTES:": "",
  "# 1. NEVER commit secrets to version control": "",
  "# 2. Use environment variables for all sensitive data": "",
  "# 3. Consider using a secrets manager:": "",
  "#    - AWS Secrets Manager": "",
  "#    - HashiCorp Vault": "",
  "#    - Azure Key Vault": "",
  "#    - Google Secret Manager": "",
  "# 4. Rotate credentials regularly": "",
  "# 5. Use principle of least privilege": "",
  
  "# ==========================================": "",
  "# REQUIRED ENVIRONMENT VARIABLES": "",
  "# ==========================================": "",
  "# The following MUST be set before starting the broker:": "",
  "# - KAWASAN_BROKER_ID (unique integer per broker)": "",
  "# - KAWASAN_ADVERTISED_HOST (externally accessible hostname)": "",
  "# - KAWASAN_SSL_KEYSTORE_PASSWORD (if SSL enabled)": "",
  "# - KAWASAN_SSL_KEY_PASSWORD (if SSL enabled)": "",
  "# - KAWASAN_SSL_TRUSTSTORE_PASSWORD (if SSL enabled)": "",
  
  "# ==========================================": "",
  "# OPTIONAL ENVIRONMENT VARIABLES": "",
  "# ==========================================": "",
  "# All other ${VAR:default} settings can be overridden": "",
  "# via environment variables for flexibility across deployments": ""
}
