{
  "# ==========================================": "",
  "# Kawasan Broker - Staging Configuration": "",
  "# ==========================================": "",
  "# This configuration mirrors production but with:": "",
  "# - Lower resource limits for cost efficiency": "",
  "# - Shorter retention periods": "",
  "# - More verbose logging for debugging": "",
  "# - Test-friendly settings": "",
  
  "# Broker Identity (set via environment variable)": "",
  "broker.id": "${KAWASAN_BROKER_ID:0}",
  "host": "${KAWASAN_HOST:0.0.0.0}",
  "advertised.host": "${KAWASAN_ADVERTISED_HOST:localhost}",
  "port": "${KAWASAN_PORT:9092}",
  
  "# Storage Paths": "",
  "log.dirs": "${KAWASAN_LOG_DIRS:/var/lib/kawasan/staging}",
  
  "# Network Settings": "",
  "num.network.threads": 4,
  "num.io.threads": 4,
  "socket.send.buffer.bytes": 131072,
  "socket.receive.buffer.bytes": 131072,
  "socket.request.max.bytes": 52428800,
  
  "# Log Settings (moderate retention for staging)": "",
  "log.segment.bytes": 536870912,
  "log.retention.hours": 72,
  "log.retention.bytes": 107374182400,
  "log.retention.check.interval.ms": 300000,
  "log.cleanup.policy": "delete",
  
  "# Flush Settings (balanced durability)": "",
  "log.flush.interval.messages": 10000,
  "log.flush.interval.ms": 1000,
  
  "# Replication Settings (mirrors production)": "",
  "default.replication.factor": 3,
  "min.insync.replicas": 2,
  "offsets.topic.replication.factor": 3,
  "transaction.state.log.replication.factor": 3,
  "transaction.state.log.min.isr": 2,
  
  "# Recovery Settings": "",
  "num.recovery.threads.per.data.dir": 2,
  "replica.lag.time.max.ms": 30000,
  "num.replica.fetchers": 2,
  
  "# Compression (enabled)": "",
  "compression.type": "lz4",
  
  "# Group Coordinator Settings": "",
  "group.initial.rebalance.delay.ms": 3000,
  "group.max.session.timeout.ms": 300000,
  "group.min.session.timeout.ms": 6000,
  
  "# Producer Settings": "",
  "max.request.size": 1048576,
  
  "# Consumer Settings": "",
  "fetch.min.bytes": 1,
  "fetch.max.wait.ms": 500,
  
  "# Partition Settings": "",
  "num.partitions": 3,
  
  "# Metrics and Monitoring": "",
  "metrics.recording.level": "INFO",
  "monitoring.port": "${KAWASAN_MONITORING_PORT:8080}",
  "monitoring.enabled": true,
  
  "# Topic Management": "",
  "auto.create.topics.enable": false,
  "delete.topic.enable": true,
  
  "# Logging (more verbose than prod)": "",
  "log.level": "${KAWASAN_LOG_LEVEL:info}",
  "log.format": "${KAWASAN_LOG_FORMAT:json}",
  
  "# Security Settings": "",
  "security.protocol": "${KAWASAN_SECURITY_PROTOCOL:PLAINTEXT}",
  
  "# TLS Settings (if enabled)": "",
  "ssl.enabled": "${KAWASAN_SSL_ENABLED:false}",
  "ssl.keystore.location": "${KAWASAN_SSL_KEYSTORE:/etc/kawasan/ssl/keystore.jks}",
  "ssl.keystore.password": "${KAWASAN_SSL_KEYSTORE_PASSWORD}",
  "ssl.key.password": "${KAWASAN_SSL_KEY_PASSWORD}",
  "ssl.truststore.location": "${KAWASAN_SSL_TRUSTSTORE:/etc/kawasan/ssl/truststore.jks}",
  "ssl.truststore.password": "${KAWASAN_SSL_TRUSTSTORE_PASSWORD}",
  
  "# SASL Settings (if enabled)": "",
  "sasl.enabled": "${KAWASAN_SASL_ENABLED:false}",
  "sasl.mechanism": "${KAWASAN_SASL_MECHANISM:PLAIN}",
  
  "# Performance Tuning": "",
  "socket.send.buffer.bytes": 131072,
  "socket.receive.buffer.bytes": 131072,
  
  "# Staging-specific notes": "",
  "# - Use environment variables for secrets": "",
  "# - Mirror production topology (3+ brokers)": "",
  "# - Test failure scenarios regularly": "",
  "# - Monitor resource usage to tune production": ""
}
