# Kawasan Broker Configuration - Broker 2

# Broker Identity
broker.id=2

# Network Configuration
listeners=PLAINTEXT://0.0.0.0:9092
advertised.listeners=PLAINTEXT://broker-2:9092

# Raft Configuration
raft.port=9093
raft.peers=0:broker-0:9093,1:broker-1:9093,2:broker-2:9093

# Storage Configuration
log.dirs=/var/lib/kawasan/data
num.partitions=3
default.replication.factor=3

# Log Retention Configuration
log.retention.hours=168
log.retention.bytes=1073741824
log.segment.bytes=1073741824

# Monitoring Configuration
monitoring.enabled=true
monitoring.host=0.0.0.0
monitoring.port=9094

# Consumer Group Configuration
group.retention.ms=604800000
consumer.lag.check.interval.ms=30000

# Auto Create Topics
auto.create.topics.enable=true

# Performance Configuration
num.io.threads=8
num.network.threads=3
