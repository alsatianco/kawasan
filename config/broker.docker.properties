{
  "# ============================================": "",
  "# Kawasan Broker - Docker-host Configuration": "",
  "# ============================================": "",
  "# Listens on 0.0.0.0 and advertises host.docker.internal so Docker": "",
  "# containers (e.g. Schema Registry, Connect) can connect via the": "",
  "# host-gateway hostname.": "",

  "broker.id": 0,
  "host": "0.0.0.0",
  "advertised.host": "host.docker.internal",
  "port": 9092,

  "log.dirs": "/tmp/kawasan-dev-logs",

  "num.network.threads": 2,
  "num.io.threads": 2,
  "socket.send.buffer.bytes": 65536,
  "socket.receive.buffer.bytes": 65536,
  "socket.request.max.bytes": 10485760,

  "log.segment.bytes": 104857600,
  "log.retention.hours": 24,
  "log.retention.bytes": 1073741824,
  "log.retention.check.interval.ms": 60000,
  "log.cleaner.interval.ms": 5000,
  "log.cleanup.policy": "delete",

  "log.flush.interval.messages": 1000,
  "log.flush.interval.ms": 500,

  "default.replication.factor": 1,
  "min.insync.replicas": 1,
  "offsets.topic.replication.factor": 1,
  "transaction.state.log.replication.factor": 1,
  "transaction.state.log.min.isr": 1,

  "num.recovery.threads.per.data.dir": 1,
  "compression.type": "none",

  "group.initial.rebalance.delay.ms": 0,
  "group.max.session.timeout.ms": 30000,
  "group.min.session.timeout.ms": 6000,

  "max.request.size": 1048576,
  "fetch.min.bytes": 1,
  "fetch.max.wait.ms": 100,
  "num.partitions": 1,

  "metrics.recording.level": "DEBUG",
  "monitoring.host": "0.0.0.0",
  "monitoring.port": 9094,
  "monitoring.enabled": true,
  "consumer.lag.metrics.enabled": false,
  "consumer.lag.check.interval.ms": 30000,

  "auto.create.topics.enable": true,
  "delete.topic.enable": true,

  "log.level": "info",
  "log.format": "text",

  "security.protocol": "PLAINTEXT"
}
