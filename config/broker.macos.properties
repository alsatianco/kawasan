{
  "broker.id": 0,
  "host": "0.0.0.0",
  "port": 9092,
  "log.dirs": "/usr/local/var/kawasan/data",
  
  "# Network settings": "",
  "num.network.threads": 4,
  "num.io.threads": 4,
  "socket.send.buffer.bytes": 102400,
  "socket.receive.buffer.bytes": 102400,
  "socket.request.max.bytes": 104857600,
  
  "# Log settings": "",
  "log.segment.bytes": 536870912,
  "log.retention.hours": 168,
  "log.retention.check.interval.ms": 300000,
  "log.cleanup.policy": "delete",
  
  "# Replication settings": "",
  "default.replication.factor": 1,
  "min.insync.replicas": 1,
  "replica.lag.time.max.ms": 30000,
  
  "# Raft settings (for multi-broker clusters)": "",
  "# raft.port: Port for Raft inter-broker communication (default: 9093)": "",
  "raft.port": 9093,
  "# raft.peers: Comma-separated list of broker_id:host:port for Raft cluster": "",
  "# Example: \"0:localhost:9093,1:localhost:9094,2:localhost:9095\"": "",
  "# Leave empty for single-node mode": "",
  "raft.peers": "",
  
  "# Performance tuning": "",
  "num.replica.fetchers": 2,
  "num.recovery.threads.per.data.dir": 1,
  "log.flush.interval.messages": 10000,
  "log.flush.interval.ms": 1000,
  
  "# Compression": "",
  "compression.type": "snappy",
  
  "# Group coordinator settings": "",
  "group.initial.rebalance.delay.ms": 3000,
  "group.max.session.timeout.ms": 300000,
  
  "# Producer settings": "",
  "max.request.size": 1048576,
  
  "# Consumer settings": "",
  "fetch.min.bytes": 1,
  "fetch.max.wait.ms": 500,
  
  "# Zookeeper settings (if needed for Kafka compatibility)": "",
  "zookeeper.connection.timeout.ms": 18000,
  
  "# Metrics and monitoring": "",
  "metrics.recording.level": "INFO",
  
  "# macOS specific settings": "",
  "# Note: macOS has lower default file descriptor limits": "",
  "# Ensure you increase them via launchd or ulimit": ""
}
