# Oracle Docker-Compose: Apache Kafka 4.2.0 single-broker stack.
#
# 0B.2: This compose is the behavioral oracle for the ecosystem harness.
# Every smoke script in `scripts/` runs against this compose first to lock
# in "the expected behavior" and then against `docker-compose.kawasan.yml`
# to verify Kawasan matches. The diff between Kafka-pass and Kawasan-result
# is the answer for every test.
#
# Usage:
#   docker compose -f docker-compose.kafka.yml up -d
#   ./scripts/run_all.sh kafka
#   docker compose -f docker-compose.kafka.yml down -v

services:
  kafka:
    # KRaft-mode single-node. Stays on 4.2.0 to match the doc's reference.
    image: apache/kafka:4.2.0
    container_name: kawasan-harness-kafka-oracle
    hostname: kafka
    ports:
      - "9092:9092"
      # Auxiliary services share this broker's network namespace so Metadata
      # localhost endpoints work for host clients and container clients alike.
      - "8081:8081"
      - "8082:8080"
      - "8083:8083"
      - "8088:8088"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
      KAFKA_SUPER_USERS: User:ANONYMOUS
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: kawasan-harness-oracle-001
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 12
