version: '3.8'

services:
  kawasan-broker-1:
    build: .
    container_name: kawasan-broker-1
    hostname: broker1
    ports:
      - "9092:9092"
    environment:
      - KAWASAN_BROKER_ID=0
      - KAWASAN_HOST=broker1
      - KAWASAN_PORT=9092
      - KAWASAN_LOG_DIR=/var/lib/kawasan/data
    volumes:
      - kawasan-data-1:/var/lib/kawasan/data
    networks:
      - kawasan-network

  # Uncomment for multi-broker cluster
