apiVersion: v1
kind: Service
metadata:
  name: {{ include "kawasan.fullname" . }}
  labels:
    {{- include "kawasan.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: kafka
      protocol: TCP
      name: kafka
    {{- if .Values.metrics.enabled }}
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "kawasan.selectorLabels" . | nindent 4 }}
---
{{- if and (eq .Values.deploymentType "statefulset") .Values.service.headless.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kawasan.fullname" . }}-headless
  labels:
    {{- include "kawasan.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: {{ .Values.service.port }}
      targetPort: kafka
      protocol: TCP
      name: kafka
  selector:
    {{- include "kawasan.selectorLabels" . | nindent 4 }}
{{- end }}
