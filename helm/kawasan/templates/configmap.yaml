apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kawasan.fullname" . }}-config
  labels:
    {{- include "kawasan.labels" . | nindent 4 }}
data:
  broker.properties: |
    # Broker Configuration
    broker.id=0
    
    # Network Settings
    listeners={{ .Values.config.listeners }}
    advertised.listeners=PLAINTEXT://{{ include "kawasan.fullname" . }}:{{ .Values.service.port }}
    num.network.threads={{ .Values.config.numNetworkThreads }}
    num.io.threads={{ .Values.config.numIoThreads }}
    
    # Socket Settings
    socket.send.buffer.bytes={{ .Values.config.socketSendBufferBytes }}
    socket.receive.buffer.bytes={{ .Values.config.socketReceiveBufferBytes }}
    socket.request.max.bytes={{ .Values.config.socketRequestMaxBytes }}
    
    # Log Settings
    log.dirs={{ .Values.config.logDirs }}
    num.partitions={{ .Values.config.numPartitions }}
    num.recovery.threads.per.data.dir={{ .Values.config.numRecoveryThreadsPerDataDir }}
    
    # Log Retention
    log.retention.hours={{ .Values.config.logRetentionHours }}
    log.retention.bytes={{ .Values.config.logRetentionBytes }}
    log.segment.bytes={{ .Values.config.logSegmentBytes }}
    log.retention.check.interval.ms={{ .Values.config.logRetentionCheckIntervalMs }}
    
    # Log Cleanup
    log.cleanup.policy={{ .Values.config.logCleanupPolicy }}
    log.cleaner.enable={{ .Values.config.logCleanerEnable }}
    
    # Replication Settings
    default.replication.factor={{ .Values.config.defaultReplicationFactor }}
    min.insync.replicas={{ .Values.config.minInsyncReplicas }}
    
    # Performance Tuning
    compression.type={{ .Values.config.compressionType }}
    num.replica.fetchers={{ .Values.config.numReplicaFetchers }}
    replica.fetch.max.bytes={{ .Values.config.replicaFetchMaxBytes }}
    
    # Group Coordinator Settings
    group.initial.rebalance.delay.ms={{ .Values.config.groupInitialRebalanceDelayMs }}
    group.max.session.timeout.ms={{ .Values.config.groupMaxSessionTimeoutMs }}
    group.min.session.timeout.ms={{ .Values.config.groupMinSessionTimeoutMs }}
    
    # Other Settings
    auto.create.topics.enable={{ .Values.config.autoCreateTopicsEnable }}
    delete.topic.enable={{ .Values.config.deleteTopicEnable }}
