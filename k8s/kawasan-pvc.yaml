---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kawasan-data-pvc
  labels:
    app: kawasan
    component: broker
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  # Uncomment and specify your storage class for production
  # storageClassName: fast-ssd
  # For AWS EBS
  # storageClassName: gp3
  # For GCP Persistent Disk
  # storageClassName: pd-ssd
  # For Azure Disk
  # storageClassName: managed-premium

---
